name: VTLOffmp3g web (GitHub Pages)

# Publishes the PC web app (apps/VTLOffmp3g-web/dist) to GitHub Pages.
# Enable Pages first: Settings -> Pages -> Source: GitHub Actions. Then run this workflow from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/VTLOffmp3g-web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
