plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vtlo.offmp3g'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vtlo.offmp3g'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs out of the box.
            // Swap in your own signingConfig before publishing to a store.
            signingConfig signingConfigs.debug
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    // FFmpegKit full-gpl build (x264, libvpx, opus, lame, libass, freetype, ...).
    // The original com.arthenica artifacts were retired; this is a maintained re-publish.
    implementation 'io.github.jamaismagic.ffmpeg:ffmpeg-kit-main-full-gpl-16kb:6.1.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'
}
